name: LadyGo CI

on:
  push:
    branches:
      - main
      - ladygo-clean-rewrite
  pull_request:
    branches:
      - main

jobs:
  android-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate Expo config
        run: npx expo config --type public
      - name: Check Expo dependency compatibility
        run: npx expo-doctor
      - name: Export Android bundle
        run: npx expo export --platform android
