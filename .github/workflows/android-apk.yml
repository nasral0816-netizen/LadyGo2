name: Android APK Build
# Native map renderer: MapLibre

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build LadyGo APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
      EXPO_PUBLIC_PROTOMAPS_STYLE_URL: ${{ secrets.PROTOMAPS_STYLE_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android

      - name: Configure Gradle plugin repositories
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/settings.gradle")
          content = path.read_text()
          marker = "pluginManagement {"
          if marker not in content:
              raise SystemExit("pluginManagement block is missing from android/settings.gradle")
          repositories = """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
              }
          """
          content = content.replace(marker, repositories, 1)
          path.write_text(content)
          print("Configured plugin repositories")
          PY

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LadyGo-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
